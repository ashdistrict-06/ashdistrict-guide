<h2>処分について</h2>
<p class="sub">違反したときの扱い</p>
<p>禁止事項に抵触するなどルール違反があった場合、<strong>事実確認のうえアドミンが判断</strong>し、処分を言い渡します。</p>

<div class="tablebox">
    <table>
        <thead><tr><th>処分</th><th>内容</th></tr></thead>
        <tbody>
            <tr>
                <td class="nowrap"><span class="badge cd">イエローカード</span></td>
                <td><strong>1週間のログイン禁止。</strong>累計 <strong>2枚でBAN</strong></td>
            </tr>
            <tr>
                <td class="nowrap"><span class="badge busy">レッドカード</span></td>
                <td><strong>即時BAN</strong></td>
            </tr>
        </tbody>
    </table>
</div>

<div class="note warn">
    <span class="warn-title">⚠️ イエローカードは消えません</span>
    処分が明けても<strong>イエローカードがなくなることはありません。</strong>2度目のイエローでBANとなります。
</div>

<h3>組織に所属している場合</h3>
<p><strong>軍（ARC）とレジスタンスには、別の処分項目があります。</strong>それぞれのルールを確認してください（<a href="#org-arc">軍（ARC）</a> / <a href="#org-resistance">レジスタンス</a>）。</p>
