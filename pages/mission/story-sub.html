<h2>サブミッション</h2>
<p class="sub">ストーリーの横道</p>
<p>サブはメインストーリーの横道にあたるミッションです。掲示板から受けられます。</p>
<ul>
    <li><strong>今いる章のサブだけが受けられます。</strong>他の章のサブは出てきません</li>
    <li><strong>メインを進めると、新しいサブが追加される</strong>ことがあります。掲示板を時々のぞいてみてください</li>
    <li><strong>一度きりです。</strong>クリアすると同じものは受けられません</li>
</ul>
<p>受注枠の扱いはメイン以外と同じです。サブを受けている間は、単発やジョブは受けられません（<a href="#basic-accept">受注の流れ</a>）。</p>

<div class="note">サブを飛ばしてもメインは進められます。ただしワイプで章が変わると、その章のサブは受けられなくなります。</div>
